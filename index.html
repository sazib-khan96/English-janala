<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href=".//img/logo.png" type="image/x-icon" />
    <title>English Janala | Best learning app</title>

    <!-- Custon style sheet connect  -->
    <link rel="stylesheet" href="./stylesheet/style.css" />

    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- fontwesome cdn  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- daisyui + tailwind link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="bg-blue-200">
      <header
        class="flex justify-between items-center p-3 w-8/10 mx-auto relative"
      >
        <div class="logo flex items-center">
          <span class="text-blue-500 font-bold">English</span>
          <img src="./img/logo.png" alt="" />
          <span class="bangla_font">জানালা</span>
        </div>

        <div id="toggle_item" class="hidden md:flex">
          <li class="list-none flex gap-5">
            <a href="#" class="border px-3 py-1"
              ><i class="fa-regular fa-circle-question"></i>Faq
            </a>
            <a href="#" class="border px-3 py-1">
              <i class="fa-solid fa-book-open"></i>Learning</a
            >
            <a href="#" class="border px-3 py-1"
              ><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a
            >
          </li>
        </div>
        <span id="toggle-btn" class="block absolute right-4 md:hidden"
          ><i class="fa-solid fa-bars"></i
        ></span>
      </header>
    </section>

    <!-- hero section  -->

    <section
      class="flex flex-col-reverse p-5 md:flex-row text-center md:w-4/5 mx-auto p-3 items-center gap-5"
    >
      <div class="flex-1 space-y-3">
        <h1 class="text-4xl font-bold text-blue-400 md:text-left">
          English <span class="text-black">is easy</span>
        </h1>
        <p class="bangla md:text-left">
          আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা
          আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে
          অন্য একটি Level এ
        </p>
        <form action="#" class="md:text-left">
          <input
            type="email"
            placeholder="Your Email"
            class="input input-neutral mb-2 mx-auto w-100 outline-none"
          />
          <button class="btn btn-primary w-100">Get Start</button>
        </form>
      </div>
      <div class="flex-1">
        <img src="./img/hero-student.png" alt="" />
      </div>
    </section>

    <!-- lesson Container show lesson btn  -->

    <section class="mt-5">
      <h1 class="text-4xl font-bold text-blue-400 text-center">
        Let's<span class="text-black">Learn Vocabularies</span>
      </h1>
      <div
        id="lesson_Container"
        class="show_lesson flex justify-center gap-5 flex-wrap mt-5"
      ></div>
    </section>
    <!-- Word details show container  -->
    <section
      id="word-Container"
      class="grid grid-cols-2 md:grid-cols-4 gap-5 md:p-10 w-4/5 mx-auto my-10 h-full"
    >
      <!-- inside card start here  -->
    </section>

    <script src="./script/index.js"></script>
  </body>
</html>
